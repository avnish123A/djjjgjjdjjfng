<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

    <meta property="og:type" content="website" />

    <style>
      @keyframes logo-pulse { 0%, 100% { opacity: .4; } 50% { opacity: 1; } }
